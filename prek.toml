minimum_pre_commit_version = "4.0.0"

default_language_version = { python = "python3.14" }

repos = [
  { repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v6.0.0", hooks = [
    { id = "trailing-whitespace", exclude = ".*\\.md$" },
    { id = "end-of-file-fixer", exclude = ".*\\.md$" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-added-large-files" },
  ] },
  { repo = "https://github.com/rvben/rumdl-pre-commit", rev = "v0.0.153", hooks = [
    { id = "rumdl", args = ["--fix"] },
  ] },
  { repo = "https://github.com/rhysd/actionlint", rev = "v1.7.7", hooks = [
    { id = "actionlint" },
  ] },
  { repo = "https://github.com/shellcheck-py/shellcheck-py", rev = "v0.11.0.1", hooks = [
    { id = "shellcheck", types = ["shell"], args = ["-x"] },
  ] },
  { repo = "https://github.com/codespell-project/codespell", rev = "v2.4.1", hooks = [
    { id = "codespell", additional_dependencies = ["tomli"] },
  ] },
  { repo = "https://github.com/pre-commit/mirrors-mypy", rev = "v1.18.2", hooks = [
    { id = "mypy", args = ["--explicit-package-bases", "custom_components/animated_scenes"], pass_filenames = false, additional_dependencies = [
      "homeassistant-stubs",
      "types-cffi",
      "types-PyMySQL",
      "types-pyRFC3339",
      "types-python-dateutil",
      "types-PyYAML",
      "types-requests",
      "types-setuptools",
    ] },
  ] },
  { repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.13.3", hooks = [
    { id = "ruff-check", args = ["--fix"] },
    { id = "ruff-format" },
  ] },
]
