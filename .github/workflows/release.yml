name: Update Version and Create Zip on Release
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  update_version_and_create_zip:
    name: Update Version and Create Zip on Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Use the release branch when available so git-auto-commit can push
          # back cleanly; otherwise keep the workflow's triggering ref.
          ref: ${{ github.event_name == 'release' && github.event.release.target_commitish || github.ref }}

      - name: Debug GitHub Variables
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: |
          printf 'github.event_name: %s\n' "$EVENT_NAME"
          printf 'github.ref_name: %s\n' "$REF_NAME"
          printf 'github.event.release.tag_name: %s\n' "$RELEASE_TAG_NAME"
          printf 'github.event.repository.default_branch: %s\n' "$DEFAULT_BRANCH"
          printf 'github.event.release.target_commitish: %s\n' "$RELEASE_TARGET_COMMITISH"
          printf 'github.event.release.prerelease: %s\n' "$RELEASE_PRERELEASE"
          printf 'github.event.release.draft: %s\n' "$RELEASE_DRAFT"

      - name: Update Version in Manifest
        if: ${{ github.event_name == 'release' && github.event.release.draft == false }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i "s|\"version\"\s*\:\s*\".*\"|\"version\"\:\"${RELEASE_TAG}\"|g" ./custom_components/animated_scenes/manifest.json

      - name: Update Version in const.py
        if: ${{ github.event_name == 'release' && github.event.release.draft == false }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i "s|^VERSION \= \".*\"|VERSION \= \"${RELEASE_TAG}\"|" ./custom_components/animated_scenes/const.py

      - name: Commit & Push Version Changes
        if: ${{ github.event_name == 'release' && github.event.release.draft == false && github.event.release.prerelease == false  }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.event.release.target_commitish }}
          commit_message: 'Updating to version ${{ github.event.release.tag_name }} [skip ci]'

      - name: Update Release with Version Changes Commit
        if: ${{ github.event_name == 'release' && github.event.release.draft == false && github.event.release.prerelease == false  }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git tag -f -- "$RELEASE_TAG"
          git push -f origin "refs/tags/$RELEASE_TAG"

      - name: Create Zip
        run: |
          cd ${{ github.workspace }}/custom_components/animated_scenes
          zip animated_scenes.zip -r ./

      - name: Upload Zip to Release
        if: ${{ github.event_name == 'release' && github.event.release.draft == false }}
        uses: softprops/action-gh-release@v3
        with:
          files: ./custom_components/animated_scenes/animated_scenes.zip
          tag_name: ${{ github.event.release.tag_name }}

      - name: Add Zip to Action
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: animated_scenes
          path: ./custom_components/animated_scenes/animated_scenes.zip
          if-no-files-found: error
