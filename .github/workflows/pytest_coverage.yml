name: pytest and coverage

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest and coverage report
    runs-on: ubuntu-latest
    permissions:
      # Required by python-coverage-comment-action to publish PR comments and
      # maintain its coverage dashboard data. Fork PR tokens are downgraded by GitHub.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Debug GitHub Variables
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '' }}
        run: |
          printf 'github.event_name: %s\n' "$EVENT_NAME"
          printf 'github.ref_name: %s\n' "$REF_NAME"
          printf 'github.event.repository.default_branch: %s\n' "$DEFAULT_BRANCH"
          printf 'github.event.pull_request.user.type: %s\n' "$PR_USER_TYPE"
          printf 'PR labels: %s\n' "$PR_LABELS"

      - name: Setup Python 3 (with caching)
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install pytest Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --group pytest -e .

      - name: Run pytest with coverage (pytest-cov)
        run: pytest

      - name: 'Generate coverage Comment (and possibly Post to PR)'
        if: ${{ !(github.event_name == 'pull_request' && ( contains(github.event.pull_request.labels.*.name, 'dependencies') || github.event.pull_request.user.type == 'Bot' )) }}
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Store PR Comment to be Posted
        if: ${{ steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
          name: python-coverage-comment-action
          # If you use a different name, update COMMENT_FILENAME accordingly
          path: python-coverage-comment-action.txt
          retention-days: 1
